name: Test ActaWP extractor

on:
  push:
    branches:
      - actawp-calendar-sync
  workflow_dispatch:

jobs:
  test-actawp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-actawp.txt

      - name: Inspect ActaWP through Jina Reader
        run: python actawp_jina_test.py
