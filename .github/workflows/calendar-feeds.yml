name: Calendarios de familias
on:
  push:
    branches: [main]
    paths: ['data/**', 'scripts/**', 'tests/**', 'mi-calendario.*', 'official-schedule.js', 'index.html', 'sw.js', '.github/workflows/calendar-feeds.yml']
  pull_request:
    paths: ['calendars/**', 'data/**', 'actawp_*.py', '*.gs', 'requirements-actawp.txt', 'scripts/**', 'tests/**', 'mi-calendario.*', 'official-schedule.js', 'index.html', 'sw.js', '.github/workflows/*.yml']
  workflow_dispatch:
  # Ejecutar después de publicar el snapshot evita competir con el push de ActaWP.
  # workflow_run también se dispara cuando el workflow anterior usa GITHUB_TOKEN.
  workflow_run:
    workflows: ['ActaWP export']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: family-calendar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  feeds:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run.head_sha precede al commit JSON que publica el exportador.
          # En PR se conserva el merge ref para probar los cambios propuestos.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-actawp.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      # Un snapshot nuevo (por ejemplo una lectura manual de ActaWP) deja `calendars/` desfasado hasta que se regenera: si las pruebas
      # corrieran antes, fallarían las que comparan lo publicado con lo regenerado y nunca se llegaría a publicar (13/11/2026).
      # Se regenera primero (igual que «Clupik overlay»); el generador sigue negándose a escribir si el snapshot es parcial o
      # inconsistente, y solo se publica si después pasan todas las pruebas.
      - name: Regenerar los feeds desde el último snapshot publicado
        run: node scripts/calendar-feeds.mjs
      - run: node --test tests/*.test.mjs
      - run: node scripts/calendar-feeds.mjs
      - name: Publicar feeds validados
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendars/
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated family calendar feeds'
            git pull --rebase origin main
            node scripts/calendar-feeds.mjs
            git add calendars/
            git diff --cached --quiet || git commit -m 'Refresh feeds after snapshot update'
            git push origin HEAD:main
          fi

