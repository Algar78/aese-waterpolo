name: ActaWP export

# Este workflow ya NO consulta ActaWP. Las condiciones de uso de Clupik prohíben
# el acceso automatizado sin autorización escrita (ver docs/audit-2026-10-18.md).
# Lee las páginas que una persona guarda desde su navegador y sube a data/manual/
# (instrucciones en data/manual/README.md). El nombre se conserva porque
# "Calendarios de familias" se ejecuta cuando este workflow termina.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/manual/*.html']

concurrency:
  group: actawp-export
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-actawp.txt

      - name: Read the saved ActaWP pages (no request is made)
        id: fetch
        run: |
          if python actawp_export.py --from-dir data/manual; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm complete export
        run: python scripts/validate_actawp_export.py '${{ steps.fetch.outputs.complete }}'

      - name: Publish JSON snapshot
        if: steps.fetch.outputs.complete == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          git diff --cached --quiet || git commit -m 'Update ActaWP calendar snapshot'
          # Otro push puede haber avanzado main durante la lectura.
          # Rebase conserva esos cambios; ante conflicto se falla sin forzar.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
