name: ActaWP export

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
      timezone: 'Europe/Madrid'

concurrency:
  group: actawp-export
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-actawp.txt

      - name: Fetch ActaWP calendars
        id: fetch
        run: |
          if python actawp_export.py; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish JSON snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          git diff --cached --quiet || git commit -m 'Update ActaWP calendar snapshot'
          git push

      - name: Confirm complete export
        if: steps.fetch.outputs.complete != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("data/actawp_last_attempt.json").read_text(encoding="utf-8"))
          errors = status.get("errors", [])
          # ActaWP rate limiting is temporary; keep the last good snapshot
          # and report a warning instead of failing the scheduled workflow.
          if errors and any("429" in error for error in errors) and all(
              "429" in error or "pendiente por límite" in error for error in errors
          ):
              print("::warning::ActaWP limita las consultas (HTTP 429). Se conserva el último calendario válido; se reintentará en la siguiente ejecución.")
          else:
              print("::error::Exportación ActaWP incompleta por un motivo distinto de HTTP 429.")
              for error in errors:
                  print("::error::" + error)
              raise SystemExit(1)
          PY
