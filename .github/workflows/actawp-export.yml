name: ActaWP export

on:
  push:
    branches: [main, actawp-calendar-sync]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
      timezone: 'Europe/Madrid'

concurrency:
  group: actawp-export
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-actawp.txt

      - name: Fetch ActaWP calendars
        id: fetch
        run: |
          if python actawp_export.py; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish JSON snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          git diff --cached --quiet || git commit -m 'Update ActaWP calendar snapshot'
          git push

      - name: Confirm complete export
        if: steps.fetch.outputs.complete != 'true'
        run: |
          echo 'ActaWP no devolvió las 9 categorías: se conserva snapshot existente y se ha guardado progreso de descubrimiento' >&2
          exit 1
