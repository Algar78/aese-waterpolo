async function maintainWakeLock(){
 if(!("wakeLock" in navigator))return;
 if(state.screen!=="match"||!state.started){
  if(wakeLockSentinel){try{await wakeLockSentinel.release()}catch(_e){} wakeLockSentinel=null}
  return;
 }
 if(wakeLockSentinel&&!wakeLockSentinel.released)return;
 try{
  wakeLockSentinel=await navigator.wakeLock.request("screen");
  wakeLockSentinel.addEventListener("release",()=>{wakeLockSentinel=null});
 }catch(_e){}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)maintainWakeLock()});

function validateSupabaseRosters(data){
 if(!data||!Array.isArray(data.teams)||!data.teams.length)throw new Error("La consulta no devolvió ningún equipo activo.");
 const teamsByName=new Map();
 let totalPlayers=0;
 for(const team of data.teams){
  if(!team||!team.name||teamsByName.has(team.name))throw new Error("Hay nombres de equipo duplicados o incompletos.");
  if(!Array.isArray(team.players))throw new Error(`La plantilla de ${team.name} no es válida.`);
  teamsByName.set(team.name,team);
  totalPlayers+=team.players.length;
 }
 return {teamsByName,totalPlayers};
}
async function ensureAlevinMixtoB(data){
 if(!window.aeseIsAdmin||!window.aeseIsAdmin())return data;
 if(!data||!Array.isArray(data.teams))return data;
 if(data.teams.some(team=>team&&team.name==="Alevín Mixto B"))return data;
 const client=window.AESE_AUTH?.client;
 const season=data.season;
 const teamA=data.teams.find(team=>team&&team.name==="Alevín Mixto A");
 if(!client||!season||!teamA?.categoryId)throw new Error("No se puede crear Alevín Mixto B: falta la categoría de Alevín Mixto A.");
 const rosterNames=["Adriana Puig Moreno","Bryce Villarroel Alba","Carla Freixanet Gran","Carla Guillen Prieto","Hugo Carrasco Ferreiro","Julen Vigara Silvan","Juno Abella Perez","Marc Esteras Contreras","Odett Ileana Dutu Cucunuba","Sergi Lopez Jimenez","Valeria Botia Valenzuela"];
 let team=(await client.from("teams").select("id,category_id,code,name,squad_label,is_active").eq("name","Alevín Mixto B").maybeSingle()).data;
 if(!team){
  const created=await client.from("teams").insert({
   category_id:teamA.categoryId,code:"ALEVIN_MIXTO_B",name:"Alevín Mixto B",squad_label:"Alevín Mixto B",is_active:true
  }).select("id,category_id,code,name,squad_label,is_active").single();
  if(created.error)throw created.error;
  team=created.data;
 }else if(!team.is_active){
  const activated=await client.from("teams").update({is_active:true,category_id:teamA.categoryId}).eq("id",team.id).select("id,category_id,code,name,squad_label,is_active").single();
  if(activated.error)throw activated.error;
  team=activated.data;
 }
 for(const fullName of rosterNames){
  let player=(await client.from("players").select("id").eq("full_name",fullName).maybeSingle()).data;
  if(!player){
   const createdPlayer=await client.from("players").insert({full_name:fullName}).select("id").single();
   if(createdPlayer.error)throw createdPlayer.error;
   player=createdPlayer.data;
  }
  const membership=await client.from("team_players").select("id,is_active").eq("season_id",season.id).eq("team_id",team.id).eq("player_id",player.id).maybeSingle();
  if(membership.error)throw membership.error;
  if(!membership.data){
   const inserted=await client.from("team_players").insert({season_id:season.id,team_id:team.id,player_id:player.id,is_active:true}).select("id").single();
   if(inserted.error)throw inserted.error;
  }else if(!membership.data.is_active){
   const activated=await client.from("team_players").update({is_active:true}).eq("id",membership.data.id);
   if(activated.error)throw activated.error;
  }
 }
 const refreshed=await window.AESE_ROSTERS.getCurrentSeasonRoster();
 if(!refreshed||!Array.isArray(refreshed.teams)||!refreshed.teams.some(team=>team.name==="Alevín Mixto B"))throw new Error("Alevín Mixto B no aparece tras su creación.");
 return refreshed;
}

async function loadMasterRosters(){
 if(masterRostersLoading||masterRostersReady)return;
 masterRostersLoading=true;
 let timeoutId=null;
 try{
  if(!window.AESE_ROSTERS||typeof window.AESE_ROSTERS.getCurrentSeasonRoster!=="function")throw new Error("No está disponible AESE_ROSTERS.getCurrentSeasonRoster().");
  let data=await Promise.race([window.AESE_ROSTERS.getCurrentSeasonRoster(),new Promise((_,reject)=>{timeoutId=setTimeout(()=>reject(new Error("La consulta de plantillas ha superado el tiempo de espera.")),12000)})]);
  data=await ensureAlevinMixtoB(data);
  const validated=validateSupabaseRosters(data);
  supabaseRosterByTeam=validated.teamsByName;
  activeRosterTeams=Array.from(supabaseRosterByTeam.values());
  masterRosterSource="supabase";
  const teamCounts=Object.fromEntries(activeRosterTeams.map(team=>[team.name,team.players.length]));
  console.info("[AESE] Plantillas cargadas desde Supabase.",{season:data.season?.code||null,teamCount:activeRosterTeams.length,totalPlayers:validated.totalPlayers,teamCounts});
 }catch(error){activateLocalRosterFallback(error?.message||error)}
 finally{if(timeoutId)clearTimeout(timeoutId);masterRostersReady=true;masterRostersLoading=false;if(typeof window.render==="function")window.render()}
}

async function persistMatchState(){
 if(!state.matchId||!window.AESE_AUTH?.client)return {ok:false,reason:"no-match"};
 if(!aeseIsAdmin()&&completedMatchPersistedId===state.matchId){
  setSaveStatus("🔒 Partido finalizado");
  return {ok:false,reason:"completed"};
 }
 const client=window.AESE_AUTH.client;
 const requestSeq=++saveRequestSeq;
 setSaveStatus("↻ Guardando…");
 const snapshot={...state,matchId:undefined};
 delete snapshot.matchId;
 const persistedStatus=state.screen==="final"?"completed":(state.started?"in_progress":"draft");
 const result=await client.from("matches").update({
  status:persistedStatus,
  score_aese:state.score[0],score_opponent:state.score[1],current_period:state.period,
  period_remaining_ms:Math.max(0,Math.round(state.remainingMs)),state_snapshot:snapshot,updated_at:new Date().toISOString()
 }).eq("id",state.matchId).select("id").maybeSingle();
 if(result.error){
  if(requestSeq===saveRequestSeq)setSaveStatus("⚠ No sincronizado");
  console.warn("[AESE] No se pudo sincronizar el partido.",result.error);
  return {ok:false,error:result.error};
 }
 if(!result.data){
  if(!aeseIsAdmin()&&completedMatchPersistedId===state.matchId){
   if(requestSeq===saveRequestSeq)setSaveStatus("🔒 Partido finalizado");
   return {ok:true,alreadyCompleted:true};
  }
  if(requestSeq===saveRequestSeq)setSaveStatus("⚠ No sincronizado");
  console.warn("[AESE] La actualización no afectó a ningún partido. Puede haber una restricción RLS.");
  return {ok:false,error:new Error("La actualización no afectó a ningún partido.")};
 }
 if(persistedStatus==="completed")completedMatchPersistedId=state.matchId;
 if(requestSeq===saveRequestSeq)setSaveStatus(persistedStatus==="completed"?"🔒 Partido finalizado":"● Guardado");
 return {ok:true};
}
function currentGameSeconds(){const r=state.remainingMs;return Math.max(0,Math.round(RULES[state.category].periodSeconds-r/1000))}

function syncTimer(){if(!state.timerRunning||state.timeoutRunning)return;const now=Date.now();const delta=now-(state.timerStartedAt||now);state.remainingMs=Math.max(0,state.remainingMs-delta);state.timerStartedAt=now;if(state.remainingMs<=0){state.timerRunning=false;addEvent('⏱ Fin del período');saveLocal();render();toast('Período finalizado')}}
function tick(){syncTimer();if(state.screen==='match'){const el=document.getElementById('gameTimer');if(el)el.textContent=clockText(state.remainingMs);const st=document.getElementById('timerState');if(st)st.textContent=state.timerRunning?'EN JUEGO':'PAUSADO';}}

 if(!participationComplete()){
   const missing=participationMissing();const lineup=currentPeriodLineup();ensurePoolPositions(lineup);const missingPositions=Object.entries(POOL_POSITIONS).filter(([k])=>lineup.positions[k]===null).map(([,d])=>d.label);
   toast(missingPositions.length?`Antes de iniciar P${state.period}, completa la alineación en la piscina: ${missingPositions.join(', ')}`:(isAlevinCategory()&&participationAssignedCount()===state.players.length?`Antes de iniciar P${state.period}, deben quedar exactamente 7 jugadores como PARTICIPA.`:`Antes de iniciar P${state.period}, indica la participación de todos los jugadores: ${missing.map(p=>p.name).join(', ')}`));

function eventPlayerMeta(p){return p?{playerId:p.playerId||null,teamPlayerId:p.teamPlayerId||null,playerCapNumber:p.capNumber??p.num??null,playerName:p.name||null}:{};}
function addEvent(text,extra={}){state.events.push({eventId:(crypto?.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(16).slice(2)),period:state.period,time:currentGameSeconds(),text,...extra})}
function deriveMatchStats(events,players){
 const stats={};
 (players||[]).forEach(p=>{const key=p.teamPlayerId||p.playerId||('cap-'+(p.capNumber??p.num));stats[key]={key,name:p.name||'Jugador',capNumber:p.capNumber??p.num??null,goals:0,penaltyGoals:0,penaltyAttempts:0,penaltyMisses:0,exclusions:0,participationPeriods:Array.isArray(p.participatedPeriods)?p.participatedPeriods.length:(p.periods||0)};});
 (events||[]).forEach(e=>{const key=e.teamPlayerId||e.playerId||null;if(!key||!stats[key])return;const st=stats[key];
  if(e.eventType==='goal'){st.goals++;}
  if(e.eventType==='penalty_goal'){st.goals++;st.penaltyGoals++;st.penaltyAttempts++;}
  if(e.eventType==='penalty_miss'){st.penaltyAttempts++;st.penaltyMisses++;}
  if(e.eventType==='exclusion'){st.exclusions++;}
 });
 // The player objects already contain the authoritative participation count and regular goal total.
 (players||[]).forEach(p=>{const key=p.teamPlayerId||p.playerId||('cap-'+(p.capNumber??p.num));if(stats[key]){stats[key].goals=Number(p.goals||stats[key].goals);stats[key].participationPeriods=Array.isArray(p.participatedPeriods)?p.participatedPeriods.length:(p.periods||stats[key].participationPeriods);}});
 return Object.values(stats).sort((a,b)=>b.goals-a.goals||a.name.localeCompare(b.name));
}
function resetPeriodClock(){state.remainingMs=RULES[state.category].periodSeconds*1000;state.timerRunning=false;state.timerStartedAt=null}
function isAlevinCategory(){return state.category==='Alevín Mixto A'}
function isGoalkeeper(player){const n=Number(player?.capNumber);return n===1||n===13}
function goalkeeperPlayers(){return state.players.map((p,i)=>({p,i})).filter(x=>isGoalkeeper(x.p))}
function currentPeriodLineup(){
 state.periodLineups=state.periodLineups||{};
 const lineup=state.periodLineups[state.period]||(state.periodLineups[state.period]={starters:[],active:[],substitutions:[],goalkeeper:null,initialsLocked:false,positions:{gk:null,w1:null,d1:null,point:null,d2:null,w2:null,cf:null},positionsInitialized:false});
 // Mantener siempre sincronizados los 7 jugadores que están en el agua.
 // Esto también recupera correctamente partidos guardados de versiones anteriores.
 lineup.starters=Array.isArray(lineup.starters)?lineup.starters:[];
 lineup.active=Array.isArray(lineup.active)?lineup.active:[];
 lineup.substitutions=Array.isArray(lineup.substitutions)?lineup.substitutions:[];
 if(lineup.active.length!==7 && lineup.starters.length===7) lineup.active=lineup.starters.slice();
 lineup.active=lineup.active.filter(i=>Number.isInteger(i)&&state.players?.[i]);
 if(lineup.active.length!==7 && lineup.starters.length===7) lineup.active=lineup.starters.slice();

function participationKey(player,i){return player.teamPlayerId||player.playerId||('cap-'+(player.capNumber??player.num??i))}
function currentPeriodParticipation(){state.periodParticipation=state.periodParticipation||{};return state.periodParticipation[state.period]||(state.periodParticipation[state.period]={})}
function participationAssignedCount(){const pp=currentPeriodParticipation();return state.players.filter((p,i)=>Object.prototype.hasOwnProperty.call(pp,participationKey(p,i))).length}
function participationMissing(){const pp=currentPeriodParticipation();return state.players.filter((p,i)=>!Object.prototype.hasOwnProperty.call(pp,participationKey(p,i)))}
function markPlayerParticipation(player,period){player.participatedPeriods=player.participatedPeriods||[];if(!player.participatedPeriods.includes(period)){player.participatedPeriods.push(period);player.periods=player.participatedPeriods.length}}
function clearPlayerParticipation(player,period){player.participatedPeriods=player.participatedPeriods||[];const pos=player.participatedPeriods.indexOf(period);if(pos!==-1){player.participatedPeriods.splice(pos,1);player.periods=player.participatedPeriods.length}}
function autoAssignBench(){
 const pp=currentPeriodParticipation(),lineup=currentPeriodLineup();
 if(lineup.starters.length!==7)return false;
 state.players.forEach((p,i)=>{const key=participationKey(p,i);if(!lineup.starters.includes(i)){pp[key]=false;clearPlayerParticipation(p,state.period)}});
 lineup.starters.forEach(i=>{const p=state.players[i];if(p){pp[participationKey(p,i)]=true;markPlayerParticipation(p,state.period)}});
 return true;
}
function participationComplete(){
 const lineup=currentPeriodLineup();ensurePoolPositions(lineup);
 const positionsReady=Object.values(lineup.positions).every(v=>v!==null)&&new Set(Object.values(lineup.positions)).size===7;
 return state.players.length>=7&&lineup.starters.length===7&&lineup.goalkeeper!==null&&lineup.starters.includes(lineup.goalkeeper)&&isGoalkeeper(state.players[lineup.goalkeeper])&&participationAssignedCount()===state.players.length&&positionsReady;
}
function setPeriodGoalkeeper(i){
 const player=state.players[i];if(!player||!isGoalkeeper(player)){toast('Ese gorro no está identificado como portero. Los gorros 1 y 13 son los porteros.');return}
 if(state.timerRunning||state.timeoutRunning){toast('El portero del período ya está cerrado porque el cronómetro está en marcha.');return}
 const lineup=currentPeriodLineup();
 if(lineup.goalkeeper===i)return;
 snapshot();
 const old=lineup.goalkeeper;
 if(old!==null&&lineup.starters.includes(old)){lineup.starters=lineup.starters.filter(x=>x!==old);lineup.active=lineup.active.filter(x=>x!==old);ensurePoolPositions(lineup);Object.keys(lineup.positions).forEach(k=>{if(lineup.positions[k]===old)lineup.positions[k]=null});clearPlayerParticipation(state.players[old],state.period);}
 if(!lineup.starters.includes(i)){
   if(lineup.starters.length>=7){toast('Ya hay 7 jugadores seleccionados. Para cambiar el portero, selecciona primero otro jugador de campo para sustituirlo.');state.lastSnapshot=null;return}

 }
 lineup.goalkeeper=i;ensurePoolPositions(lineup);lineup.positions.gk=i;lineup.positionsInitialized=true;markPlayerParticipation(player,state.period);
 currentPeriodParticipation()[participationKey(player,i)]=true;
 if(lineup.starters.length===7)autoAssignBench();
 saveLocal();render();
}

 lineup.active=lineup.active.filter(x=>x!==i);
 if(lineup.goalkeeper===i)lineup.goalkeeper=null;
 ensurePoolPositions(lineup);Object.keys(lineup.positions).forEach(k=>{if(lineup.positions[k]===i)lineup.positions[k]=null});lineup.positionsInitialized=false;

function setPeriodParticipation(i,willParticipate){
 const player=state.players[i];if(!player)return;
 if(state.timerRunning||state.timeoutRunning){toast('La alineación de este período ya está cerrada porque el cronómetro está en marcha.');return}
 const pp=currentPeriodParticipation(),key=participationKey(player,i),lineup=currentPeriodLineup();
 if(!willParticipate){

 }

 if(lineup.starters.length>=7){toast(`P${state.period}: ya hay 7 jugadores iniciales. Los demás quedan automáticamente como NO PARTICIPA.`);return}
 if(isGoalkeeper(player)&&lineup.goalkeeper!==null&&lineup.goalkeeper!==i){toast('Solo puede haber un portero en el agua. Si quieres cambiarlo, selecciona el nuevo portero en la zona de PORTEROS.');return}
 if(!isGoalkeeper(player)&&lineup.starters.filter(x=>!isGoalkeeper(state.players[x])).length>=6){toast('Ya hay 6 jugadores de campo seleccionados. Falta únicamente el portero.');return}
 snapshot();
 lineup.starters.push(i);lineup.active.push(i);pp[key]=true;markPlayerParticipation(player,state.period);
 if(isGoalkeeper(player))lineup.goalkeeper=i;
 if(lineup.starters.length===7){autoAssignBench();toast(`P${state.period}: 7 jugadores seleccionados. El resto queda automáticamente como NO PARTICIPA.`)}

}

function selectSubstitutionPlayer(i){
 const lineup=currentPeriodLineup();
 const player=state.players[i];
 if(!player)return;
 if(lineup.active.length!==7 && lineup.starters.length===7) lineup.active=lineup.starters.slice();
 if(lineup.active.length!==7){toast('Todavía no hay 7 jugadores en el agua.');return;}
 const active=lineup.active.includes(i);
 const side=active?'water':'bench';

 // Un único selector bidireccional: se puede empezar por CUALQUIER jugador.
 if(state.selectedSubstitutionIndex===null || state.selectedSubstitutionSide===null){
   state.selectedSubstitutionIndex=i;
   state.selectedSubstitutionSide=side;
   state.pendingSubOut=active?i:null;
   state.pendingSubIn=active?null:i;
   state.substitutionMode=true;
   saveLocal();render();
   toast(active ? `SALE seleccionado: ${playerLabel(player)}. Ahora pulsa un jugador del BANQUILLO.` : `ENTRA seleccionado: ${playerLabel(player)}. Ahora pulsa un jugador del AGUA.`);
   return;
 }

 // Pulsar de nuevo el mismo jugador lo deselecciona.
 if(state.selectedSubstitutionIndex===i){
   clearPendingSubstitution();saveLocal();render();return;
 }

 // Si se pulsa otro jugador del mismo grupo, simplemente cambia la selección.
 if(state.selectedSubstitutionSide===side){
   state.selectedSubstitutionIndex=i;
   state.pendingSubOut=active?i:null;
   state.pendingSubIn=active?null:i;
   state.substitutionMode=true;

   toast(active ? `SALE seleccionado: ${playerLabel(player)}` : `ENTRA seleccionado: ${playerLabel(player)}`);
   return;
 }

function prepareNextPeriodLineup(){

 // Es crítico usar los 7 que realmente estaban EN EL AGUA al terminar el período anterior,
 // incluyendo las sustituciones realizadas durante ese período.
 const nextPeriod=state.period;
 const previousPeriod=nextPeriod-1;
 const previous=state.periodLineups?.[previousPeriod];
 if(!previous)return;
 const next={starters:[],active:[],substitutions:[],goalkeeper:null,initialsLocked:false,positions:{gk:null,w1:null,d1:null,point:null,d2:null,w2:null,cf:null},positionsInitialized:false};
 const previousActive=Array.isArray(previous.active)&&previous.active.length===7
   ? previous.active.slice()
   : (Array.isArray(previous.starters)?previous.starters.slice():[]);
 previousActive.forEach(i=>{
   if(Number.isInteger(i)&&state.players?.[i]&&!next.starters.includes(i))next.starters.push(i);
 });
 // Al comenzar un nuevo período, entran automáticamente los mismos 7 que terminaron el anterior.
 // starters y active parten de la misma alineación; luego se puede cambiar cualquier jugador antes de iniciar.
 next.active=next.starters.slice();
 const prevPos=previous.positions||{};
 Object.keys(next.positions).forEach(k=>{
   const v=prevPos[k];
   if(Number.isInteger(v)&&next.starters.includes(v))next.positions[k]=v;
 });
 // Si la posición anterior no puede recuperarse (partido antiguo/incompleto), rellenamos las posiciones
 // restantes con los mismos 7 activos, sin dejar huecos.
 const used=new Set(Object.values(next.positions).filter(Number.isInteger));
 const remaining=next.starters.filter(i=>!used.has(i));
 Object.keys(next.positions).forEach(k=>{
   if(next.positions[k]===null&&remaining.length)next.positions[k]=remaining.shift();
 });
 next.positionsInitialized=next.starters.length===7&&Object.values(next.positions).every(v=>v!==null)&&new Set(Object.values(next.positions)).size===7;
 const oldKeeper=previous.goalkeeper;
 if(Number.isInteger(oldKeeper)&&next.starters.includes(oldKeeper)&&isGoalkeeper(state.players[oldKeeper])) {
   next.goalkeeper=oldKeeper;
 } else {
   const keeper=next.starters.find(i=>isGoalkeeper(state.players[i]));
   if(Number.isInteger(keeper))next.goalkeeper=keeper;
 }
 state.periodLineups[nextPeriod]=next;
 const pp={};
 state.players.forEach((p,i)=>{
   const key=participationKey(p,i);
   if(next.starters.includes(i)){pp[key]=true;markPlayerParticipation(p,nextPeriod);}else{pp[key]=false;clearPlayerParticipation(p,nextPeriod);}
 });
 state.periodParticipation[nextPeriod]=pp;
}

function ensurePoolPositions(lineup){
 lineup.positions=lineup.positions||{gk:null,w1:null,d1:null,point:null,d2:null,w2:null,cf:null};
 // Durante el partido la fuente de verdad de quién está en el agua es ACTIVE, no STARTERS.
 // STARTERS conserva los siete que iniciaron el período; ACTIVE cambia con las sustituciones.
 const activeList=Array.isArray(lineup.active)&&lineup.active.length===7?lineup.active:(lineup.starters||[]);
 const valid=new Set(activeList);
 Object.keys(POOL_POSITIONS).forEach(k=>{if(lineup.positions[k]!==null&&!valid.has(lineup.positions[k]))lineup.positions[k]=null});
 if(lineup.goalkeeper!==null&&valid.has(lineup.goalkeeper)&&isGoalkeeper(state.players[lineup.goalkeeper])) lineup.positions.gk=lineup.goalkeeper;
 return lineup.positions;
}

function autoAssignPoolPositions(lineup){
 const pos=ensurePoolPositions(lineup);
 if(lineup.positionsInitialized)return pos;
 const activeList=Array.isArray(lineup.active)&&lineup.active.length===7?lineup.active:(lineup.starters||[]);
 if(lineup.goalkeeper!==null&&activeList.includes(lineup.goalkeeper))pos.gk=lineup.goalkeeper;
 const used=new Set(Object.entries(pos).filter(([k,v])=>k!=='gk'&&v!==null).map(([k,v])=>v));
 const fields=activeList.filter(i=>i!==lineup.goalkeeper&&!used.has(i));
 ['w1','d1','point','d2','w2','cf'].forEach(k=>{if(pos[k]===null){const i=fields.shift();if(i!==undefined){pos[k]=i;used.add(i)}}});
 return pos;
}

  <div class="card"><h2>👥 Participación</h2>${players.length?players.map(p=>`<div class="event"><span>${escapeRosterText(p.name||'Jugador')} ${p.capNumber?`· Nº ${p.capNumber}`:''}</span><b>${p.participatedPeriods?.length||p.periods||0} períodos</b></div>`).join(''):'<p class="muted">Sin datos de participación.</p>'}</div>
  <div class="card"><h2>📝 Incidencias</h2>${events.filter(e=>e.eventType==='incident').length?events.filter(e=>e.eventType==='incident').map(e=>`<div class="event"><span>${escapeRosterText(e.incidentText||e.text||'')}</span><b>P${e.period}</b></div>`).join(''):'<p class="muted">Sin incidencias registradas.</p>'}</div>
  <div class="card"><h2>📝 Todos los eventos</h2>${events.length?`<div class="timeline">${events.map(e=>`<div class="event"><span><span class="eventTime">${String(Math.floor((e.time||0)/60)).padStart(2,'0')}:${String((e.time||0)%60).padStart(2,'0')}</span> ${escapeRosterText(e.text||'')}</span><span>P${e.period||''}</span></div>`).join('')}</div>`:'<p class="muted">Sin eventos registrados.</p>'}<div class="actions"><button class="primary" onclick="printHistory()">📄 IMPRIMIR / GUARDAR PDF</button>${adminDeleteButton(m.id,true)}<button class="ghost" onclick="state.screen='history';render()">← Historial</button></div></div></section>`;
}
function printHistory(){window.print()}
function showHistory(){state.screen="history";render()}
function showPreMatchReview(){
 if(!state.preMatchReviewPending||state.timerRunning)return;
 const selected=state.players.length;
 const withCaps=state.players.filter(p=>p.capNumber!==null&&p.capNumber!==undefined&&p.capNumber!=='').length;
 openModal(`<h2>🔎 Revisa la convocatoria</h2><p class="muted">Antes de iniciar el partido, comprueba que los jugadores convocados y sus números de gorro son correctos.</p><div class="card" style="margin:12px 0;background:#f7f9fb"><b>${selected} jugadores convocados</b><br><span class="muted">${withCaps} con gorro asignado.</span></div><div class="actions"><button class="primary" onclick="dismissPreMatchReview()">✓ HE REVISADO, CONTINUAR</button><button class="secondary" onclick="closeModal();showPreMatchPlayers()">👥 VER JUGADORES Y GORROS</button></div>`);
}
function showPreMatchPlayers(){
 const rows=state.players.map(p=>`<div class="event"><span>${escapeRosterText(p.name)}</span><b>${p.capNumber?`Nº ${p.capNumber}`:'SIN GORRO'}</b></div>`).join('');
 openModal(`<h2>👥 Convocados y gorros</h2><div class="timeline" style="max-height:55vh;overflow:auto">${rows||'<p class="muted">No hay jugadores convocados.</p>'}</div><p class="muted">Si necesitas cambiar la convocatoria o un gorro, hazlo en la pantalla de convocatoria antes de guardar el partido.</p>`);
}
function dismissPreMatchReview(){state.preMatchReviewPending=false;closeModal();saveLocal();render();}
function addIncident(){
 openModal(`<h2>📝 Incidencia</h2><p class="muted">Anota cualquier incidencia que quieras conservar en las estadísticas del partido.</p><textarea id="incidentText" rows="5" maxlength="500" placeholder="Escribe la incidencia…" style="width:100%;resize:vertical;padding:12px;border:1px solid #cadaeb;border-radius:12px;font:inherit"></textarea><div class="actions"><button class="primary" onclick="saveIncident()">GUARDAR INCIDENCIA</button></div>`);
}
function saveIncident(){
 const el=document.getElementById('incidentText');const text=(el?.value||'').trim();if(!text){toast('Escribe una incidencia antes de guardar.');return}snapshot();addEvent(`📝 Incidencia · ${text}`,{eventType:'incident',incidentText:text});saveLocal();render();toast('Incidencia registrada');
}
function formatMinutes(seconds){return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`}
function ruleSummary(){const r=RULES[state.category]||{};const timeout=r.timeout?`Sí · ${r.maxTimeouts} por equipo · ${formatMinutes(r.timeoutSeconds)}`:'No';return `<div class="card" style="margin:12px 0;background:#f7f9fb"><b>${escapeRosterText(state.category)}</b><div class="event"><span>Períodos</span><b>${r.periods||'-'}</b></div><div class="event"><span>Duración por período</span><b>${r.periodSeconds?formatMinutes(r.periodSeconds):'-'}</b></div><div class="event"><span>Descanso</span><b>${r.intervalSeconds?formatMinutes(r.intervalSeconds):'-'}</b></div><div class="event"><span>Descanso medio</span><b>${r.halftimeSeconds?formatMinutes(r.halftimeSeconds):'-'}</b></div><div class="event"><span>Posesión</span><b>${escapeRosterText(r.possession||'-')}</b></div><div class="event"><span>Expulsión</span><b>${r.exclusionSeconds||'-'} s</b></div><div class="event"><span>Tiempos muertos</span><b>${timeout}</b></div></div><p class="muted" style="font-size:12px">Esta configuración es la que utiliza el motor del partido. Las normativas FCN 2026-2027 figuran como provisionales y pueden actualizarse.</p>`}
function showRules(){openModal(`<h2>📘 Reglas del partido</h2>${ruleSummary()}`)}
function showMore(){openModal(`<h2>☰ Más acciones</h2><div class="grid grid2"><button class="ghost" onclick="closeModal();addIncident()">📝 Incidencia</button><button class="secondary" onclick="closeModal();showRules()">📘 Reglas</button></div>`)}
function openPlayerModal(title,cb){openModal(`<h2>${title}</h2><div class="players">${state.players.map((p,i)=>`<button class="player" onclick="playerPick(${i})"><strong>${escapeRosterText(p.name)}</strong><span>${p.capNumber?`Nº ${p.capNumber} · `:""}${p.goals} goles · ${p.periods} períodos</span></button>`).join("")}</div>`);window._playerCb=cb}
function playerPick(i){const cb=window._playerCb;const p=state.players[i];closeModal();cb(p)}
function openModal(content){const m=document.getElementById("modal");m.innerHTML=`<div class="modalbox">${content}<div class="actions"><button class="ghost" onclick="closeModal()">CANCELAR</button></div></div>`;m.classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function undo(){if(state.lastSnapshot){const snap=state.lastSnapshot;state.score=snap.score;state.players=snap.players;state.expulsions=snap.expulsions;state.events=snap.events;state.period=snap.period;state.partials=snap.partials;state.remainingMs=snap.remainingMs;state.timerRunning=snap.timerRunning;state.timerStartedAt=snap.timerStartedAt;state.screen=snap.screen;state.periodLineups=snap.periodLineups||{};state.substitutionMode=snap.substitutionMode||false;state.pendingSubOut=snap.pendingSubOut??null;state.pendingSubIn=snap.pendingSubIn??null;state.selectedSubstitutionIndex=snap.selectedSubstitutionIndex??null;state.selectedSubstitutionSide=snap.selectedSubstitutionSide??null;state.lastSnapshot=null;saveLocal();render();toast('Última acción revertida')}else toast('No hay una acción reversible reciente')}
function saveLocal(){
 try{
  localStorage.setItem("aese_prototype",JSON.stringify(state));
 }catch(error){
  setSaveStatus("⚠ Sin guardado local");
  console.warn("[AESE] No se pudo guardar la copia local.",error);
  return false;
 }
 if(state.matchId)persistMatchState();
 else setSaveStatus("● Guardado local");
 return true;
}
function shareSummary(){if(navigator.share)navigator.share({title:"Resumen AESE Waterpolo",text:`${state.category}: AESE ${state.score[0]}-${state.score[1]} ${state.rival}`}).catch(()=>{});else{navigator.clipboard?.writeText(`AESE ${state.score[0]}-${state.score[1]} ${state.rival} · ${state.category}`);toast("Resumen copiado al portapapeles")}}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.remove("hidden");setTimeout(()=>x.classList.add("hidden"),2200)}
if(!timerHandle){timerHandle=setInterval(()=>{tick();tickTimeout()},1000)}
render();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message',event=>{
    if(event.data?.type==='AESE_UPDATE_READY'){
      setTimeout(()=>toast('🆕 Hay una nueva versión de AESE Waterpolo. Recarga la aplicación.'),500);
    }
  });
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('[AESE] SW',err)));
}
</script>
</body>
</html>
